name: Deploy static site to Linux

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      host:
        description: Target host or IP. Falls back to vars/secrets.LINUX_DEPLOY_HOST.
        required: false
        type: string
      ssh_port:
        description: Target SSH port. Falls back to vars/secrets.LINUX_DEPLOY_PORT or 22.
        required: false
        type: string
      ssh_user:
        description: Target SSH user. Falls back to vars/secrets.LINUX_DEPLOY_USER.
        required: false
        type: string
      deploy_path:
        description: Absolute directory to clear and extract into. Falls back to vars/secrets.LINUX_DEPLOY_PATH.
        required: false
        type: string
      targets:
        description: JSON array of deploy targets. Overrides single-target inputs/vars/secrets when provided.
        required: false
        type: string
      telegram_chat_id:
        description: Telegram chat id for deployment notification. Falls back to vars/secrets.TELEGRAM_CHAT_ID.
        required: false
        type: string

concurrency:
  group: linux-static-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    environment: production-linux
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stage static files
        shell: bash
        run: |
          set -euo pipefail
          stage_dir="$RUNNER_TEMP/out"
          rm -rf "$stage_dir"
          mkdir -p "$stage_dir"

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_headers' \
            --exclude='_redirects' \
            --exclude='.DS_Store' \
            ./ "$stage_dir/"

          test -f "$stage_dir/index.html"
          echo "STAGE_DIR=$stage_dir" >> "$GITHUB_ENV"

      - name: Precompress /index.html (gzip, brotli, zstd)
        shell: bash
        run: |
          set -euo pipefail
          target="$STAGE_DIR/index.html"

          missing=()
          command -v gzip >/dev/null 2>&1 || missing+=(gzip)
          command -v brotli >/dev/null 2>&1 || missing+=(brotli)
          command -v zstd >/dev/null 2>&1 || missing+=(zstd)
          if (( ${#missing[@]} > 0 )); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi

          gzip -9 -k -f "$target"
          brotli -q 11 -k -f "$target"
          zstd --ultra -22 -k -f "$target" -o "${target}.zst"

          raw_bytes="$(stat -c%s "$target")"
          printf 'Precompressed /index.html (%s B):\n' "$raw_bytes"
          for ext in .gz .br .zst; do
            sidecar="${target}${ext}"
            compressed_bytes="$(stat -c%s "$sidecar")"
            if (( compressed_bytes >= raw_bytes )); then
              rm -f -- "$sidecar"
              printf '  %s: skipped (%s B >= %s B)\n' "$ext" "$compressed_bytes" "$raw_bytes"
            else
              printf '  %s: %s B\n' "$ext" "$compressed_bytes"
            fi
          done

      - name: Pack output
        shell: bash
        run: |
          set -euo pipefail
          test -f "$STAGE_DIR/index.html"
          tar -C "$STAGE_DIR" -cf - . | zstd -T0 -3 -o "$RUNNER_TEMP/site.tar.zst"

      - name: Resolve deploy settings
        shell: bash
        env:
          INPUT_DEPLOY_HOST: ${{ github.event.inputs.host }}
          INPUT_DEPLOY_PORT: ${{ github.event.inputs.ssh_port }}
          INPUT_DEPLOY_USER: ${{ github.event.inputs.ssh_user }}
          INPUT_DEPLOY_PATH: ${{ github.event.inputs.deploy_path }}
          INPUT_DEPLOY_TARGETS: ${{ github.event.inputs.targets }}
          VAR_DEPLOY_HOST: ${{ vars.LINUX_DEPLOY_HOST }}
          VAR_DEPLOY_PORT: ${{ vars.LINUX_DEPLOY_PORT }}
          VAR_DEPLOY_USER: ${{ vars.LINUX_DEPLOY_USER }}
          VAR_DEPLOY_PATH: ${{ vars.LINUX_DEPLOY_PATH }}
          VAR_DEPLOY_TARGETS: ${{ vars.LINUX_DEPLOY_TARGETS }}
          SECRET_DEPLOY_HOST: ${{ secrets.LINUX_DEPLOY_HOST }}
          SECRET_DEPLOY_PORT: ${{ secrets.LINUX_DEPLOY_PORT }}
          SECRET_DEPLOY_USER: ${{ secrets.LINUX_DEPLOY_USER }}
          SECRET_DEPLOY_PATH: ${{ secrets.LINUX_DEPLOY_PATH }}
          SECRET_DEPLOY_TARGETS: ${{ secrets.LINUX_DEPLOY_TARGETS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ipaddress
          import json
          import os
          import posixpath
          import re
          import sys

          UNSAFE_DEPLOY_PATHS = {
              "", "/", "/.", "/..", "/bin", "/boot", "/dev", "/etc", "/home",
              "/lib", "/lib64", "/opt", "/proc", "/root", "/run", "/sbin",
              "/srv", "/sys", "/tmp", "/usr", "/var",
          }

          def first_non_empty(*values):
              for v in values:
                  if isinstance(v, str) and v.strip():
                      return v.strip()
              return ""

          def required_text(value, label, index):
              text = "" if value is None else str(value).strip()
              if not text:
                  raise ValueError(f"Deploy target #{index + 1} is missing required field: {label}")
              return text

          def is_valid_ip(host):
              try:
                  ipaddress.ip_address(host)
                  return True
              except ValueError:
                  return False

          def normalize_target(target, index):
              if not isinstance(target, dict):
                  raise ValueError(f"Deploy target #{index + 1} must be an object")

              host = required_text(target.get("host"), "host", index)
              port = str(target.get("port") if target.get("port") is not None else target.get("ssh_port", "22")).strip()
              user = required_text(
                  target.get("user") if target.get("user") is not None else target.get("ssh_user"),
                  "user",
                  index,
              )
              raw_path = required_text(
                  target.get("path") if target.get("path") is not None else target.get("deploy_path"),
                  "path",
                  index,
              )
              name = str(target.get("name") if target.get("name") is not None else f"target-{index + 1}").strip()

              if not re.fullmatch(r"[0-9]+", port):
                  raise ValueError(f"Invalid SSH port for deploy target #{index + 1}: {port}")
              port_number = int(port)
              if port_number < 1 or port_number > 65535:
                  raise ValueError(f"SSH port is outside 1-65535 for deploy target #{index + 1}: {port}")

              if not re.fullmatch(r"[A-Za-z0-9._-]+", name):
                  raise ValueError(f"Invalid deploy target name for target #{index + 1}: {name}")

              if not is_valid_ip(host) and (
                  not re.fullmatch(r"[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?", host)
                  or ".." in host
              ):
                  raise ValueError(f"Invalid IP address or DNS host for deploy target #{index + 1}: {host}")

              if not re.fullmatch(r"[A-Za-z0-9_][A-Za-z0-9._-]*", user):
                  raise ValueError(f"Invalid SSH user for deploy target #{index + 1}: {user}")

              if re.search(r"[\x00\r\n\t]", raw_path) or not raw_path.startswith("/"):
                  raise ValueError(f"Deploy path must be a clean absolute path for target #{index + 1}: {raw_path}")

              deploy_path = posixpath.normpath(raw_path).rstrip("/") or "/"
              comparable_raw = raw_path.rstrip("/") or "/"
              if deploy_path != comparable_raw:
                  raise ValueError(
                      f"Deploy path must not contain repeated, dot, or parent segments for target #{index + 1}: {raw_path}"
                  )
              if deploy_path in UNSAFE_DEPLOY_PATHS:
                  raise ValueError(f"Refusing unsafe deploy path for deploy target #{index + 1}: {deploy_path}")

              return {
                  "name": name,
                  "host": host,
                  "port": str(port_number),
                  "user": user,
                  "path": deploy_path,
              }

          env = os.environ
          targets_json = first_non_empty(
              env.get("INPUT_DEPLOY_TARGETS"),
              env.get("VAR_DEPLOY_TARGETS"),
              env.get("SECRET_DEPLOY_TARGETS"),
          )

          if targets_json:
              try:
                  parsed = json.loads(targets_json)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"Invalid LINUX_DEPLOY_TARGETS JSON: {exc}")
              if not isinstance(parsed, list) or len(parsed) == 0:
                  raise SystemExit("LINUX_DEPLOY_TARGETS must be a non-empty JSON array")
              targets = [normalize_target(item, idx) for idx, item in enumerate(parsed)]
          else:
              single = {
                  "name": "default",
                  "host": first_non_empty(
                      env.get("INPUT_DEPLOY_HOST"),
                      env.get("VAR_DEPLOY_HOST"),
                      env.get("SECRET_DEPLOY_HOST"),
                  ),
                  "port": first_non_empty(
                      env.get("INPUT_DEPLOY_PORT"),
                      env.get("VAR_DEPLOY_PORT"),
                      env.get("SECRET_DEPLOY_PORT"),
                      "22",
                  ),
                  "user": first_non_empty(
                      env.get("INPUT_DEPLOY_USER"),
                      env.get("VAR_DEPLOY_USER"),
                      env.get("SECRET_DEPLOY_USER"),
                  ),
                  "path": first_non_empty(
                      env.get("INPUT_DEPLOY_PATH"),
                      env.get("VAR_DEPLOY_PATH"),
                      env.get("SECRET_DEPLOY_PATH"),
                  ),
              }
              targets = [normalize_target(single, 0)]

          seen = set()
          for t in targets:
              if t["name"] in seen:
                  raise SystemExit(f"Duplicate deploy target name: {t['name']}")
              seen.add(t["name"])

          targets_file = os.path.join(env.get("RUNNER_TEMP", "."), "deploy-targets.json")
          with open(targets_file, "w", encoding="utf-8") as f:
              json.dump(targets, f, indent=2)
              f.write("\n")

          remote_archive = (
              f"/tmp/kukisa-github-io-{env.get('GITHUB_RUN_ID', 'local')}-"
              f"{env.get('GITHUB_RUN_ATTEMPT', '1')}.tar.zst"
          )

          github_env = env.get("GITHUB_ENV")
          if not github_env:
              raise SystemExit("GITHUB_ENV is required when resolving deployment targets")

          with open(github_env, "a", encoding="utf-8") as f:
              f.write(f"DEPLOY_TARGETS_FILE={targets_file}\n")
              f.write(f"DEPLOY_TARGET_COUNT={len(targets)}\n")
              f.write(f"DEPLOY_TARGET_NAMES={','.join(t['name'] for t in targets)}\n")
              f.write(f"REMOTE_ARCHIVE={remote_archive}\n")
          PY

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LINUX_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LINUX_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [[ -z "${SSH_PRIVATE_KEY:-}" ]]; then
            echo "Missing required secret: LINUX_DEPLOY_SSH_KEY" >&2
            exit 1
          fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          if [[ -n "${SSH_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            echo "::warning::LINUX_DEPLOY_KNOWN_HOSTS is not configured; ssh-keyscan cannot authenticate host keys."
            : > "$HOME/.ssh/known_hosts"
            while IFS=$'\t' read -r deploy_port deploy_host; do
              ssh-keyscan -p "$deploy_port" "$deploy_host" >> "$HOME/.ssh/known_hosts"
            done < <(jq -r '.[] | [.port, .host] | @tsv' "$DEPLOY_TARGETS_FILE")
          fi

          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy to targets
        shell: bash
        run: |
          set -euo pipefail

          : "${DEPLOY_TARGETS_FILE:?DEPLOY_TARGETS_FILE is required}"
          : "${REMOTE_ARCHIVE:?REMOTE_ARCHIVE is required}"
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"

          while IFS=$'\t' read -r -u 3 target_name deploy_host deploy_port deploy_user deploy_path; do
            echo "Deploying target: $target_name"
            scp_host="$deploy_host"
            if [[ "$deploy_host" == *:* ]]; then
              scp_host="[$deploy_host]"
            fi

            scp \
              -i "$HOME/.ssh/deploy_key" \
              -P "$deploy_port" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$RUNNER_TEMP/site.tar.zst" \
              "$deploy_user@$scp_host:$REMOTE_ARCHIVE"

            remote_deploy_path="$(printf '%q' "$deploy_path")"
            remote_archive="$(printf '%q' "$REMOTE_ARCHIVE")"
            ssh \
              -i "$HOME/.ssh/deploy_key" \
              -p "$deploy_port" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$deploy_user@$deploy_host" \
              "DEPLOY_PATH=$remote_deploy_path REMOTE_ARCHIVE=$remote_archive bash -se" <<'REMOTE_EOF'
          set -euo pipefail

          case "$DEPLOY_PATH" in
            ""|"/"|"/."|"/.."|"/bin"|"/boot"|"/dev"|"/etc"|"/home"|"/lib"|"/lib64"|"/opt"|"/proc"|"/root"|"/run"|"/sbin"|"/srv"|"/sys"|"/tmp"|"/usr"|"/var")
              echo "Refusing unsafe deploy path: $DEPLOY_PATH" >&2
              exit 1
              ;;
          esac

          if [[ "$DEPLOY_PATH" != /* ]]; then
            echo "Deploy path must be absolute: $DEPLOY_PATH" >&2
            exit 1
          fi
          if [[ ! -f "$REMOTE_ARCHIVE" ]]; then
            echo "Archive not found: $REMOTE_ARCHIVE" >&2
            exit 1
          fi

          trap 'rm -f -- "$REMOTE_ARCHIVE"' EXIT
          zstd -t "$REMOTE_ARCHIVE"
          zstd -dc "$REMOTE_ARCHIVE" | tar -tf - >/dev/null
          mkdir -p "$DEPLOY_PATH"

          (
            flock 9
            find "$DEPLOY_PATH" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            zstd -dc "$REMOTE_ARCHIVE" | tar -xf - -C "$DEPLOY_PATH"
          ) 9>/tmp/kukisa-github-io-deploy.lock
          REMOTE_EOF
          done 3< <(jq -r '.[] | [.name, .host, .port, .user, .path] | @tsv' "$DEPLOY_TARGETS_FILE")

      - name: Notify Telegram
        if: ${{ always() }}
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_TELEGRAM_CHAT_ID: ${{ github.event.inputs.telegram_chat_id }}
          VAR_TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          SECRET_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -uo pipefail

          chat_id="${INPUT_TELEGRAM_CHAT_ID:-${VAR_TELEGRAM_CHAT_ID:-${SECRET_TELEGRAM_CHAT_ID:-}}}"
          token="${TELEGRAM_BOT_TOKEN:-}"

          if [[ -z "$token" || -z "$chat_id" ]]; then
            echo "Telegram notification skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured."
            exit 0
          fi

          case "$JOB_STATUS" in
            success)
              icon="✅"
              title="Deploy succeeded"
              disable_notification="true"
              ;;
            failure)
              icon="❌"
              title="Deploy failed"
              disable_notification="false"
              ;;
            cancelled)
              icon="⚠️"
              title="Deploy cancelled"
              disable_notification="false"
              ;;
            *)
              icon="ℹ️"
              title="Deploy ${JOB_STATUS}"
              disable_notification="false"
              ;;
          esac

          escape_html() {
            printf '%s' "${1:-}" \
              | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
          }

          short_sha="${GITHUB_SHA:0:7}"
          ref_name="${GITHUB_REF_NAME:-${GITHUB_REF#refs/heads/}}"
          commit_message="${HEAD_COMMIT_MESSAGE%%$'\n'*}"

          message="${icon} <b>$(escape_html "$title")</b>"
          message="${message}"$'\n'"Repository: <code>$(escape_html "$GITHUB_REPOSITORY")</code>"
          message="${message}"$'\n'"Ref: <code>$(escape_html "$ref_name")</code>"
          message="${message}"$'\n'"Commit: <a href=\"${COMMIT_URL}\">$(escape_html "$short_sha")</a>"
          message="${message}"$'\n'"Run: <a href=\"${RUN_URL}\">#$(escape_html "$GITHUB_RUN_NUMBER").$(escape_html "$GITHUB_RUN_ATTEMPT")</a>"
          message="${message}"$'\n'"Actor: <code>$(escape_html "$GITHUB_ACTOR")</code>"
          message="${message}"$'\n'"Event: <code>$(escape_html "$GITHUB_EVENT_NAME")</code>"

          if [[ -n "${DEPLOY_TARGET_NAMES:-}" ]]; then
            message="${message}"$'\n'"Targets: <code>$(escape_html "${DEPLOY_TARGET_COUNT:-?}") target(s): $(escape_html "$DEPLOY_TARGET_NAMES")</code>"
          fi

          if [[ -n "$commit_message" ]]; then
            message="${message}"$'\n'"Message: $(escape_html "$commit_message")"
          fi

          if ! curl --fail-with-body --silent --show-error \
            --request POST "https://api.telegram.org/bot${token}/sendMessage" \
            --output /dev/null \
            --data-urlencode "chat_id=${chat_id}" \
            --data-urlencode "text=${message}" \
            --data "parse_mode=HTML" \
            --data "disable_web_page_preview=true" \
            --data "disable_notification=${disable_notification}"; then
            echo "Telegram notification failed." >&2
          fi
